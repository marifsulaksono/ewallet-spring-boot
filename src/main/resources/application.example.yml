spring:
  datasource:
    url: jdbc:mysql://localhost:3306/springboot_ewallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # untuk format naming convention
  jackson:
    property-naming-strategy: SNAKE_CASE

  jpa:
    hibernate:
      ddl-auto: update   # opsi: validate | update | create | create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true

  application:
    name: ewallet-api

server:
  port: 8080

jwt:
  secret: i-love-to-share-my-knowledge-in-personality-because-i-am-a-not-master
  expiration: 3600000 # 1 jam (ms)